name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Compute base URL
        run: |
          repo_name="${{ github.event.repository.name }}"
          owner_name="${{ github.repository_owner }}"
          repo_name_lower="${repo_name,,}"
          owner_name_lower="${owner_name,,}"

          if [[ "$repo_name_lower" == "${owner_name_lower}.github.io" ]]; then
            echo "NUXT_APP_BASE_URL=/" >> "$GITHUB_ENV"
          else
            echo "NUXT_APP_BASE_URL=/${repo_name}/" >> "$GITHUB_ENV"
          fi

      - name: Generate static site
        run: pnpm generate
