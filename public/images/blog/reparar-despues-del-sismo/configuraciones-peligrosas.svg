<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5">
  <defs>
    <pattern id="l" width="16" height="8" patternUnits="userSpaceOnUse"><rect width="16" height="8" fill="#E2A483"/><path d="M0 .5H16M0 4.5H16M4 .5V4.5M12 4.5V8.5" stroke="#B4532A" stroke-width=".8"/></pattern>
  </defs>
  <rect width="640" height="300" fill="#fff"/>
  <!-- piso blando -->
  <text x="20" y="22" font-weight="800" fill="#1F2A30" font-size="14">Piso blando</text>
  <rect x="10" y="250" width="190" height="10" fill="#EAE2D5"/>
  <g transform="skewX(-0)">
    <rect x="50" y="60" width="130" height="120" fill="url(#l)"/>
    <rect x="44" y="56" width="142" height="8" fill="#2E5A70"/><rect x="44" y="116" width="142" height="8" fill="#2E5A70"/><rect x="44" y="176" width="142" height="8" fill="#2E5A70"/>
    <rect x="44" y="56" width="8" height="128" fill="#2E5A70"/><rect x="178" y="56" width="8" height="128" fill="#2E5A70"/>
  </g>
  <path d="M30 250 L38 250 L52 184 L44 184 Z" fill="#2E5A70"/>
  <path d="M164 250 L172 250 L186 184 L178 184 Z" fill="#2E5A70"/>
  <text x="58" y="226" fill="#B3261E" font-weight="700" font-size="11">1.er piso abierto</text>
  <text x="20" y="282" fill="#5B666C" font-size="11.5">Muros arriba, local o parqueadero</text>
  <text x="20" y="296" fill="#5B666C" font-size="11.5">abajo: el daño se concentra abajo.</text>

  <!-- columna corta -->
  <text x="230" y="22" font-weight="800" fill="#1F2A30" font-size="14">Columna corta</text>
  <rect x="220" y="250" width="190" height="10" fill="#EAE2D5"/>
  <rect x="250" y="60" width="16" height="190" fill="#2E5A70"/>
  <rect x="370" y="60" width="16" height="190" fill="#2E5A70"/>
  <rect x="244" y="52" width="148" height="10" fill="#2E5A70"/>
  <rect x="266" y="170" width="104" height="80" fill="url(#l)"/>
  <rect x="268" y="96" width="100" height="72" fill="#BFDCE8"/>
  <path d="M250 104 L266 150" stroke="#B3261E" stroke-width="3"/>
  <path d="M266 104 L250 150" stroke="#B3261E" stroke-width="3"/>
  <path d="M370 104 L386 150" stroke="#B3261E" stroke-width="3"/>
  <path d="M386 104 L370 150" stroke="#B3261E" stroke-width="3"/>
  <text x="290" y="135" fill="#2E5A70" font-size="11.5">ventana alta</text>
  <text x="230" y="282" fill="#5B666C" font-size="11.5">El antepecho acorta la columna:</text>
  <text x="230" y="296" fill="#5B666C" font-size="11.5">falla frágil en X por cortante.</text>

  <!-- golpeteo -->
  <text x="440" y="22" font-weight="800" fill="#1F2A30" font-size="14">Golpeteo</text>
  <rect x="430" y="250" width="200" height="10" fill="#EAE2D5"/>
  <rect x="446" y="70" width="80" height="180" fill="#AFC1C9" stroke="#2E5A70" stroke-width="3"/>
  <rect x="530" y="130" width="86" height="120" fill="#E8C3AE" stroke="#B4532A" stroke-width="3"/>
  <path d="M522 124 L534 136" stroke="#B3261E" stroke-width="4"/>
  <path d="M520 140 L528 128 M536 140 L528 128" stroke="#B3261E" stroke-width="2"/>
  <line x1="526" y1="130" x2="530" y2="130" stroke="#B3261E" stroke-width="6"/>
  <text x="440" y="282" fill="#5B666C" font-size="11.5">Edificios vecinos sin separación</text>
  <text x="440" y="296" fill="#5B666C" font-size="11.5">se golpean a nivel de placas.</text>
</svg>
