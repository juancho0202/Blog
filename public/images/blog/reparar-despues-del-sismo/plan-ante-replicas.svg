<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13">
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto"><path d="M0 0L18 9L0 18z" fill="#3E7A4C"/></marker></defs>
  <rect width="660" height="380" fill="#fff"/>
  <text x="20" y="26" font-weight="800" fill="#1F2A30" font-size="15">Planta del piso de trabajo: el plan de cinco minutos</text>
  <!-- planta -->
  <rect x="30" y="50" width="400" height="290" fill="#F4EFE7" stroke="#1F2A30" stroke-width="6"/>
  <!-- columnas -->
  <g fill="#2E5A70"><rect x="24" y="44" width="20" height="20"/><rect x="226" y="44" width="20" height="20"/><rect x="416" y="44" width="20" height="20"/><rect x="24" y="186" width="20" height="20"/><rect x="226" y="186" width="20" height="20"/><rect x="416" y="186" width="20" height="20"/><rect x="24" y="326" width="20" height="20"/><rect x="226" y="326" width="20" height="20"/><rect x="416" y="326" width="20" height="20"/></g>
  <!-- muro en desmonte -->
  <rect x="130" y="56" width="10" height="130" fill="#D9865D"/>
  <rect x="100" y="56" width="70" height="130" fill="#B3261E" opacity=".12"/>
  <text x="62" y="120" fill="#B3261E" font-size="11.5" font-weight="700">zona de</text><text x="62" y="134" fill="#B3261E" font-size="11.5" font-weight="700">riesgo</text>
  <!-- ventana / fachada -->
  <rect x="300" y="44" width="90" height="12" fill="#BFDCE8" stroke="#5B666C"/>
  <rect x="290" y="56" width="110" height="40" fill="#B3261E" opacity=".12"/>
  <!-- protección -->
  <circle cx="260" cy="226" r="20" fill="#2E5A70" opacity=".2" stroke="#2E5A70" stroke-width="2"/>
  <text x="260" y="231" text-anchor="middle" fill="#2E5A70" font-weight="800">1</text>
  <circle cx="60" cy="226" r="20" fill="#2E5A70" opacity=".2" stroke="#2E5A70" stroke-width="2"/>
  <text x="60" y="231" text-anchor="middle" fill="#2E5A70" font-weight="800">1</text>
  <!-- escalera -->
  <rect x="330" y="250" width="90" height="84" fill="#fff" stroke="#5B666C"/>
  <g stroke="#8B9DA5"><line x1="330" y1="262" x2="420" y2="262"/><line x1="330" y1="274" x2="420" y2="274"/><line x1="330" y1="286" x2="420" y2="286"/><line x1="330" y1="298" x2="420" y2="298"/><line x1="330" y1="310" x2="420" y2="310"/><line x1="330" y1="322" x2="420" y2="322"/></g>
  <text x="375" y="246" text-anchor="middle" fill="#5B666C" font-size="11.5">escalera</text>
  <!-- ruta -->
  <path d="M90 260 L200 260 L200 300 L322 300" stroke="#3E7A4C" stroke-width="5" fill="none" stroke-dasharray="10 6" marker-end="url(#a)"/>
  <circle cx="150" cy="238" r="13" fill="#3E7A4C"/><text x="150" y="243" text-anchor="middle" fill="#fff" font-weight="800">2</text>
  <!-- leyenda -->
  <g font-size="12.5">
    <circle cx="470" cy="70" r="13" fill="#2E5A70" opacity=".2" stroke="#2E5A70" stroke-width="2"/><text x="470" y="75" text-anchor="middle" fill="#2E5A70" font-weight="800">1</text>
    <text x="492" y="66" fill="#1F2A30" font-weight="700">Dónde protegerse</text><text x="492" y="82" fill="#5B666C">junto a estructura sana,</text><text x="492" y="97" fill="#5B666C">lejos de muros y ventanas</text>
    <circle cx="470" cy="140" r="13" fill="#3E7A4C"/><text x="470" y="145" text-anchor="middle" fill="#fff" font-weight="800">2</text>
    <text x="492" y="136" fill="#1F2A30" font-weight="700">Por dónde salir</text><text x="492" y="152" fill="#5B666C">después de la sacudida,</text><text x="492" y="167" fill="#5B666C">ruta siempre libre</text>
    <circle cx="470" cy="210" r="13" fill="#C98A1B"/><text x="470" y="215" text-anchor="middle" fill="#fff" font-weight="800">3</text>
    <text x="492" y="206" fill="#1F2A30" font-weight="700">Dónde encontrarse</text><text x="492" y="222" fill="#5B666C">afuera, lejos de fachadas,</text><text x="492" y="237" fill="#5B666C">postes y cables</text>
    <circle cx="470" cy="280" r="13" fill="#1F2A30"/><text x="470" y="285" text-anchor="middle" fill="#fff" font-weight="800">4</text>
    <text x="492" y="276" fill="#1F2A30" font-weight="700">Quién cuenta</text><text x="492" y="292" fill="#5B666C">el maestro; nadie entra</text><text x="492" y="307" fill="#5B666C">hasta revisar el frente</text>
  </g>
  <rect x="96" y="250" width="0" height="0"/>
  <text x="20" y="368" fill="#B3261E" font-size="12" font-weight="700">Durante la sacudida no se corre por la escalera.</text>
</svg>
