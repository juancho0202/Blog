<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <pattern id="l" width="20" height="10" patternUnits="userSpaceOnUse"><rect width="20" height="10" fill="#D9865D"/><path d="M0 .5H20M0 5.5H20M5 .5V5.5M15 5.5V10" stroke="#A8471F" stroke-width=".8"/></pattern>
    <pattern id="z" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#FBE4E1"/><path d="M0 16L16 0" stroke="#B3261E" stroke-width="2"/></pattern>
  </defs>
  <rect width="660" height="380" fill="#fff"/>
  <text x="20" y="26" font-weight="800" fill="#1F2A30" font-size="15">Corte: primero asegurar la fachada, después reparar</text>
  <!-- calle -->
  <rect x="0" y="330" width="660" height="50" fill="#5B666C"/>
  <rect x="0" y="318" width="420" height="14" fill="#C9C2B6"/>
  <!-- edificio -->
  <rect x="30" y="60" width="160" height="258" fill="#F4EFE7"/>
  <g fill="#2E5A70"><rect x="30" y="60" width="12" height="258"/><rect x="178" y="60" width="12" height="258"/><rect x="24" y="56" width="172" height="8"/><rect x="24" y="120" width="172" height="8"/><rect x="24" y="184" width="172" height="8"/><rect x="24" y="248" width="172" height="8"/></g>
  <rect x="190" y="64" width="10" height="254" fill="url(#l)"/>
  <rect x="24" y="36" width="172" height="20" fill="url(#l)"/>
  <!-- pieza suelta -->
  <rect x="192" y="134" width="12" height="40" fill="url(#l)" transform="rotate(10 198 154)"/>
  <!-- zona exclusión -->
  <rect x="200" y="296" width="220" height="22" fill="url(#z)"/>
  <path d="M200 120 L420 296" stroke="#B3261E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <g fill="#B3261E"><rect x="420" y="282" width="6" height="36"/><rect x="200" y="290" width="226" height="5"/></g>
  <text x="250" y="284" fill="#B3261E" font-weight="700" font-size="12">zona de caída aislada</text>
  <!-- entrada protegida -->
  <rect x="42" y="256" width="40" height="62" fill="#5E4A3C"/>
  <rect x="34" y="250" width="200" height="8" fill="#3E7A4C"/>
  <g stroke="#3E7A4C" stroke-width="4"><line x1="230" y1="258" x2="230" y2="318"/></g>
  <text x="96" y="278" fill="#3E7A4C" font-weight="700" font-size="11.5">entrada</text><text x="96" y="292" fill="#3E7A4C" font-weight="700" font-size="11.5">protegida</text>
  <!-- leyenda -->
  <g font-size="12.5" fill="#1F2A30">
    <text x="440" y="80" font-weight="700">1 · Aislar la zona de caída</text><text x="440" y="96" fill="#5B666C">con margen generoso</text>
    <text x="440" y="130" font-weight="700">2 · Retirar o cubrir lo suelto</text><text x="440" y="146" fill="#5B666C">desde arriba, con malla anclada,</text><text x="440" y="161" fill="#5B666C">con trabajo en alturas certificado</text>
    <text x="440" y="196" font-weight="700">3 · Proteger la entrada</text><text x="440" y="212" fill="#5B666C">o habilitar una alternativa</text>
    <text x="440" y="246" font-weight="700">4 · Nunca durante réplicas</text><text x="440" y="262" fill="#5B666C">ni con viento fuerte</text>
  </g>
</svg>
