<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect width="660" height="300" fill="#fff"/>
  <!-- verde -->
  <g transform="translate(20,20)">
    <rect width="190" height="250" rx="10" fill="#E3F0E5" stroke="#3E7A4C" stroke-width="3"/>
    <rect width="190" height="56" rx="10" fill="#3E7A4C"/><rect y="40" width="190" height="16" fill="#3E7A4C"/>
    <text x="95" y="36" text-anchor="middle" fill="#fff" font-weight="800" font-size="20">HABITABLE</text>
    <circle cx="95" cy="118" r="38" fill="#3E7A4C"/>
    <path d="M76 118 L90 132 L116 104" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="95" y="188" text-anchor="middle" fill="#1F2A30" font-size="13">Sin daños que</text>
    <text x="95" y="205" text-anchor="middle" fill="#1F2A30" font-size="13">impidan el uso</text>
    <text x="95" y="234" text-anchor="middle" fill="#3E7A4C" font-size="12" font-weight="700">Reparar lo no estructural</text>
  </g>
  <!-- amarillo -->
  <g transform="translate(235,20)">
    <rect width="190" height="250" rx="10" fill="#FDF1CF" stroke="#C98A1B" stroke-width="3"/>
    <rect width="190" height="56" rx="10" fill="#C98A1B"/><rect y="40" width="190" height="16" fill="#C98A1B"/>
    <text x="95" y="36" text-anchor="middle" fill="#fff" font-weight="800" font-size="18">USO RESTRINGIDO</text>
    <path d="M95 80 L135 152 L55 152 Z" fill="#C98A1B"/>
    <rect x="91" y="102" width="8" height="28" rx="2" fill="#fff"/><circle cx="95" cy="140" r="5" fill="#fff"/>
    <text x="95" y="188" text-anchor="middle" fill="#1F2A30" font-size="13">Requiere evaluación</text>
    <text x="95" y="205" text-anchor="middle" fill="#1F2A30" font-size="13">detallada</text>
    <text x="95" y="234" text-anchor="middle" fill="#8A6400" font-size="12" font-weight="700">No reparar todavía</text>
  </g>
  <!-- rojo -->
  <g transform="translate(450,20)">
    <rect width="190" height="250" rx="10" fill="#FBE4E1" stroke="#B3261E" stroke-width="3"/>
    <rect width="190" height="56" rx="10" fill="#B3261E"/><rect y="40" width="190" height="16" fill="#B3261E"/>
    <text x="95" y="36" text-anchor="middle" fill="#fff" font-weight="800" font-size="19">NO HABITABLE</text>
    <circle cx="95" cy="118" r="38" fill="#B3261E"/>
    <rect x="70" y="112" width="50" height="12" rx="2" fill="#fff"/>
    <text x="95" y="188" text-anchor="middle" fill="#1F2A30" font-size="13">Peligro: no debe</text>
    <text x="95" y="205" text-anchor="middle" fill="#1F2A30" font-size="13">ocuparse</text>
    <text x="95" y="234" text-anchor="middle" fill="#B3261E" font-size="12" font-weight="700">No ingresar</text>
  </g>
  <text x="330" y="292" text-anchor="middle" fill="#5B666C" font-size="11.5">Ilustración genérica. Los formatos reales varían según el municipio.</text>
</svg>
